name: adbot · 新主题 vs 老将 CPA compare (weekly Thu ~10:07 MYT)

# Weekly ROUTINE (owner request 2026-07-30): compare the 2026-07-30 theme launches
# (TRAVEL TOP3 / BEER ALCOHOL / DAY TRADING, SG+MY) against the veteran campaigns on
# real buyers + CPA, posted to a standing GitHub issue so the history lives in one thread.
# First scheduled run 2026-08-06 = exactly the 7-day mark the owner asked for.
# Cron is UTC; MYT = GMT+8: Thu 02:07 UTC = Thu 10:07 MYT.

on:
  schedule:
    - cron: "7 2 * * 4"
  workflow_dispatch: {}          # manual run any time from the Actions tab

permissions:
  issues: write
  contents: read

concurrency:
  group: adbot-compare-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Generate comparison
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/compare_new_vs_old.py > report.md
      - name: Post to the "新主题 vs 老将" issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const found = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'compare-report', per_page: 1,
            });
            let issue_number;
            if (found.data.length) {
              issue_number = found.data[0].number;
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title: '📊 新主题 vs 老将 · CPA 对比（weekly routine）',
                body: 'Weekly comparison of the 2026-07-30 theme launches vs veteran campaigns '
                    + '(real buyers + CPA, last-7d window). Runs Thu ~10:07 MYT. See comments.',
                labels: ['compare-report'],
              });
              issue_number = created.data.number;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info(`Posted comparison to issue #${issue_number}.`);
