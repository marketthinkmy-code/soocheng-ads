# ─────────────────────────────────────────────────────────────────────────────
# adbot — SG monitor config for STOCK BLOOM《1 分钟短线交易盈利营》(Soo Cheng)
#
# READ-ONLY OPS (monitor + nightly report). This file exists so the hourly CPL monitor and
# the nightly daily report can sweep the Singapore ad account (act_893025326577600,
# "[SG] MTC X SB") in addition to the MY account in config.yaml. It is loaded via
# ADBOT_CONFIG by .github/workflows/adbot-monitor-sg.yml and by the SG pass of
# .github/workflows/adbot-daily-report.yml.
#
# Only `meta.*` (account/label/conversion event), `kpi.*`, and `cpa.*` are actually read by
# those two paths. The build/drive/notion/budget blocks are copied from
# config.yaml so load_settings validates cleanly; the monitor never uses them, and
# BUILDS must NOT use this file (SG builds go through the adbot-ops GraphClient path
# so they can set the Singapore advertiser binding — see scripts/plan2_build.py).
# ─────────────────────────────────────────────────────────────────────────────

meta:
  account_label: "SG"                             # shown in the nightly report header so MY/SG sections are never confused
  ad_account_id: "act_893025326577600"            # [SG] MTC X SB — currency MYR (verified), so kpi thresholds below are direct
  page_id: "1001334883061622"                     # same Soo Cheng FB Page as MY
  instagram_user_id: "17841480427751602"          # @soochenginvesting
  pixel_id: "2602956993413536"                    # "STOCK BLOOM X MTC" pixel the SG ads optimize on (not used by the monitor)

  objective: "OUTCOME_SALES"
  optimization_goal: "OFFSITE_CONVERSIONS"
  conversion_event: "COMPLETE_REGISTRATION"       # the monitor judges only ads optimizing this event
  special_ad_categories: ["FINANCIAL_PRODUCTS_SERVICES"]

  lead_destination:
    type: "WEBSITE"
    link_url: "https://soochenginvesting.com/"
  conversion_domain: "https://soochenginvesting.com/"
  call_to_action: "LEARN_MORE"
  url_tags: "utm_source={{adset.name}}&utm_medium={{placement}}&utm_campaign={{campaign.name}}&utm_content={{ad.name}}"

  budget:                                          # unused by the monitor (builds don't use this file)
    level: "CAMPAIGN"
    daily_amount_myr: 100
    currency: "MYR"
    adset_min_spend_myr: 50

  targeting:
    countries: ["SG"]
    age_min: 25
    age_max: 65
    advantage_audience: 0
    locales: [20, 21, 22]
    excluded_custom_audiences: []

  build:
    creatives_per_adset: 10
    activate_after_build: false

naming:
  prefix: "STOCKBLOOM"                             # NOTE: monitor scope is whole-account, not prefix-filtered
  weekly_off_label: "ADBOT_WEEKLY_OFF"

drive:
  creatives_folder_id: "1j4jWK5qVxL3mGM5WrU6TloHP-tV4kzmy"
  carousel_subfolder_marker: "carousel"
  script_sidecar_ext: ".txt"

google_docs:
  caption_log_doc_id: ""
  idea_backlog_doc_id: ""

notion:
  enabled: false                                  # monitor doesn't read Notion
  database_id: "89582b42449682d4ab7f01c223c9969b"

kpi:                                              # SG account is MYR, so RM values are direct
  cpl_threshold_myr: 95.00                         # owner plan 2026-09-10「每日广告规则」: SG line at RM95
  cpl_min_spend_myr: 142.00                        # judge once spend >= RM142 = 1.5x the SG line (owner 0-reg rule)
  cpl_lookback: "week_thu"                         # week-to-date from Thursday
  pause_zero_lead_after_spend: true                # spent >= threshold spend with 0 results -> pause
  cpl_soft_reduce: true                            # TEMPORARY (owner 2026-09-10「先降 30%，再犯才关」) — same rules as MY
  cpl_reduce_pct: 0.30
  cpl_reduce_floor_myr: 30.00
  cpl_hold: ["你敢吗"]                    # 2026-08-07: SG RUNNING 你敢吗 sold 8/5+8/6 but its campaign was renamed after
                                         #   launch, so UTM keys miss and the CPA rescue can't see its sales — the CPL
                                         #   sweep mis-kills a converting ad. Exempt; proper fix = name-fallback join (8/11).

cpa:                                              # ON for SG: the Paid Student List DOES carry SG sales (utm_campaign
  enabled: true                                    #   prefixed "[sg] ..."), so the CPA gate can RESCUE a converting SG
                                                   #   ad from a CPL pause — a proven-profitable ad is never mis-closed.
  spreadsheet_id: "1NMtGKVHRYFSsUw3-dacNPYDZABcYKi6VZgMR0u_oZRE"   # STOCK BLOOM Register/OTO/Purchase list
  sales_tab: "Paid Student List"
  price_myr: 2399.00
  target_myr: 720.00
  healthy_max_myr: 800.00
  max_acceptable_myr: 960.00
  hard_stop_myr: 1200.00
  conversion_days: 14
  min_spend_myr: 1000.00

schedule:
  timezone: "Asia/Kuala_Lumpur"
  weekly_off: { day: "WED", time: "15:00" }
  weekly_on:  { day: "THU", time: "00:00" }
  monitor_interval_hours: 1

compliance:                              # ⛔ 永久禁跑名单 — owner 2026-09-23，第二次封号后的硬规则
  # 「write a rule that not to advertise these ads anymore (even tho the ads are
  #   running well and had good cpa before)」— 被 Meta 拒审过的素材永久禁投，CPA 再好也不准。
  # 匹配 = adbot.compliance.is_banned()：casefold + 去 🌟 + 去所有空格 + 子串。
  # 禁的是母带：换名/换文案/换 campaign/换账户/post 复用/重新上传都算同一支。
  # 解禁的唯一方式 = 剪辑师重剪干净版母带（算新素材，原版永不解禁）。
  banned_creatives:
    # ── 名单 A：2026-09-23 封号时账户内仍在的被拒广告（API 取证）──
    - "trading 早就不是这样了"          # 拼接 V5 ×3(MY) + ×3(SG) + 原版 video 5 ×1(SG 🌟GOLF)
    - "做么你 trading 不用看盘"          # Video 8 / HOOK：Video 8 — MY DISAPPROVED + SG ×2
    - "freestyle 1"                      # 🌟freestyle 1 @ SG 🌟INVESTMENT 被拒（30d CPA 734，仍禁）
    - "office 突访"                      # video 11：office 突访 @ SG TRAVEL
    - "炒过那么多"                       # video 12 @ SG BROKERS（2026-08-07 的解禁作废）
    - "what you do for living"           # M2Video 3 — 2025 旧 options 产品遗留，MY DISAPPROVED
    # ── 名单 B：历史被拒（旧账号 2026-07-12 取证 + owner 报告）──
    - "不是怕交易"                       # video 3 — 合规重建也被拒（视频本身违规）
    - "厌倦了等待"                       # Video 4 — 合规重建也被拒
    - "moomoo"                           # single image 5
    - "分钟赚"                           # video 1：1 分钟赚 300 — 名字即收入承诺
    - "就能盈利"                         # single image：每天 1 分钟就能盈利
    - "你敢吗"                           # video 2 — 2026-07-16 被拒
    - "freestyle 2"                      # 2026-07-16 被拒
